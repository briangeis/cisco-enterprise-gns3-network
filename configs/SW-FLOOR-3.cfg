!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
service compress-config
!
hostname SW-FLOOR-3
!
boot-start-marker
boot-end-marker
!
!
!
username admin privilege 15 secret 5 $1$C1K1$ZZk0DGwjKxs/mf402kKAt/
no aaa new-model
!
!
!
!
!
no ip routing
!
!
!
no ip domain-lookup
ip domain-name briangeis.github.io
no ip cef
no ipv6 cef
!
!
!
spanning-tree mode rapid-pvst
spanning-tree portfast edge default
spanning-tree portfast edge bpduguard default
spanning-tree extend system-id
spanning-tree vlan 40,50 priority 28672
spanning-tree vlan 60 priority 24576
!
! VLAN database and VTP settings are stored in vlan.dat, not running-config.
! Reproduced here from 'show vlan brief' and 'show vtp status'.
! VLANs below are learned from SW-FLOOR-1 via VTP, not configured locally.
!
vtp domain briangeis.github.io
vtp mode client
!
vlan 20
 name NETADMIN
!
vlan 30
 name SALES
!
vlan 40
 name MARKETING
!
vlan 50
 name ACCOUNTING
!
vlan 60
 name MANAGEMENT
!
vlan 99
 name BLACKHOLE
no cdp run
!
!
!
!
!
!
!
!
!
!
!
!
!
!
interface Port-channel2
 description Trunk Link to SW-FLOOR-1
 switchport access vlan 99
 switchport trunk allowed vlan 20,30,40,50,60
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport mode trunk
 switchport nonegotiate
!
interface Port-channel3
 description Trunk Link to SW-FLOOR-2
 switchport access vlan 99
 switchport trunk allowed vlan 20,30,40,50,60
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport mode trunk
 switchport nonegotiate
!
interface GigabitEthernet0/0
 switchport access vlan 99
 switchport mode access
 switchport nonegotiate
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security
 shutdown
 negotiation auto
 no cdp enable
!
