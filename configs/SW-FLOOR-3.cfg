interface Vlan20
 description Management SVI
 ip address 10.1.20.13 255.255.255.0
!
ip default-gateway 10.1.20.3
ip forward-protocol nd
!
no ip http server
no ip http secure-server
!
ip ssh version 2
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
ip ssh client algorithm encryption aes128-ctr aes192-ctr aes256-ctr
!
ip access-list standard VTY-NETADMIN
 remark Restrict Access to VTY Lines
 permit 10.1.20.0 0.0.0.255
 permit 10.2.20.0 0.0.0.255
!
!
!
!
!
!
control-plane
!
banner motd ^C

cisco-enterprise-network
https://github.com/briangeis/cisco-enterprise-network


Authorized access only. All activity may be monitored.

^C
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
line vty 0 4
 access-class VTY-NETADMIN in
 exec-timeout 0 0
 logging synchronous
 login local
 transport input ssh
line vty 5 15
 access-class VTY-NETADMIN in
 exec-timeout 0 0
 logging synchronous
 login local
 transport input ssh
!
ntp update-calendar
ntp server 10.1.20.1
ntp server 10.1.20.2
!
end
